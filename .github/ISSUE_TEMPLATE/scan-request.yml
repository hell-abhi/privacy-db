name: "Scan Request"
description: "Request a new app to be scanned and added to the database"
title: "Scan: [App Name]"
labels: ["scan-request"]
body:
  - type: input
    id: app_url
    attributes:
      label: Play Store URL or Package Name
      description: "Paste the Google Play Store link or the package name (e.g., com.example.app)"
      placeholder: "https://play.google.com/store/apps/details?id=com.example.app"
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: Why should this app be added?
      description: "Optional — is it popular? Privacy concerns? Frequently asked about?"
      placeholder: "This app has 100M+ downloads and requests unusual permissions..."
